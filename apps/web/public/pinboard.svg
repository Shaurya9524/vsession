<circle cx="368" cy="197" r="5" fill="#16171c"/>
<text x="372" y="250" font-family="Segoe Script, Bradley Hand, cursive" font-size="24" fill="#0b2e3d">
<tspan x="372" dy="0">hop right</tspan>
<tspan x="372" dy="28">in</tspan>
</text>
</g>

<rect x="450" y="150" width="110" height="32" rx="16" fill="#f4f4f6" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
<circle cx="468" cy="166" r="5" fill="#7c6fff"/>
<text x="482" y="171" font-family="Inter, sans-serif" font-size="14" fill="#16171c">shaurya</text>
</svg>
