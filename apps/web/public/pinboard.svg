<g transform="rotate(-6 300 155)">
<rect x="190" y="90" width="220" height="130" rx="14" fill="#ffffff"/>
<circle cx="225" cy="88" r="6" fill="#7c6fff"/>
<circle cx="222" cy="124" r="12" fill="#cec9fb"/>
<rect x="246" y="118" width="120" height="8" rx="4" fill="#e4e4e8"/>
<rect x="222" y="152" width="164" height="8" rx="4" fill="#e4e4e8"/>
<rect x="222" y="174" width="110" height="8" rx="4" fill="#e4e4e8"/>
</g>

<g transform="rotate(-3 320 345)">
<rect x="210" y="280" width="220" height="130" rx="14" fill="#101214"/>
<circle cx="248" cy="280" r="6" fill="#ff6b4a"/>
<circle cx="320" cy="345" r="28" fill="#2a2d33"/>
<path d="M310,329 L310,361 L339,345 Z" fill="#ffffff"/>
</g>

<g transform="rotate(6 430 258)">
